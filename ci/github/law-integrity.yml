# The technical guarantee of auditability (AMENDMENT-PROCESS.md invariants).
# Runs on every PR to the engineering-constitution repo itself:
#   1. registry.json is valid JSON
#   2. every law file has a matching registry entry and vice versa (1:1)
#   3. every ACTIVE law's version matches the registry
#   4. any diff to a laws/ file is accompanied by an amendment record
#      referencing that law ID — a law changed without an amendment FAILS the build
name: law-integrity

on:
  pull_request:

jobs:
  registry-consistency:
    name: Registry ↔ Law Files Consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate registry and law files (checks 1–3)
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const path = require('path');
          let failed = false;
          const fail = (msg) => { console.error(`::error::${msg}`); failed = true; };

          // 1. registry.json is valid JSON
          let registry;
          try {
            registry = JSON.parse(fs.readFileSync('laws/registry.json', 'utf8'));
          } catch (e) {
            console.error(`::error::laws/registry.json is not valid JSON: ${e.message}`);
            process.exit(1);
          }

          // Collect law files on disk
          const lawFiles = new Map(); // id -> {file, version, status, amendments}
          for (const dir of fs.readdirSync('laws')) {
            if (!dir.startsWith('article-')) continue;
            for (const f of fs.readdirSync(path.join('laws', dir))) {
              if (!/^LAW-.*\.md$/.test(f)) continue;
              const raw = fs.readFileSync(path.join('laws', dir, f), 'utf8');
              const fm = raw.match(/^---\r?\n([\s\S]*?)\r?\n---/);
              if (!fm) { fail(`${dir}/${f}: missing frontmatter`); continue; }
              const get = (k) => (fm[1].match(new RegExp(`^${k}:\\s*(.*)$`, 'm')) || [])[1]?.split('#')[0].trim();
              lawFiles.set(get('id'), {
                file: `laws/${dir}/${f}`,
                version: get('version'),
                status: get('status'),
                amendments: [...fm[1].matchAll(/amendment:\s*(AMD-[\w-]+)/g)].map((m) => m[1]),
              });
            }
          }

          // 2. 1:1 match both directions
          const regIds = new Set(registry.laws.map((l) => l.id));
          for (const l of registry.laws) {
            if (!lawFiles.has(l.id)) fail(`registry entry ${l.id} has no law file`);
            else if (lawFiles.get(l.id).file !== l.file)
              fail(`${l.id}: registry file path '${l.file}' != actual '${lawFiles.get(l.id).file}'`);
          }
          for (const [id, info] of lawFiles)
            if (!regIds.has(id)) fail(`law file ${info.file} (${id}) has no registry entry`);

          // 3. ACTIVE laws: version matches registry
          for (const l of registry.laws) {
            const f = lawFiles.get(l.id);
            if (!f) continue;
            if (f.status !== l.status) fail(`${l.id}: status '${f.status}' != registry '${l.status}'`);
            if (l.status === 'ACTIVE' && f.version !== l.version)
              fail(`${l.id}: ACTIVE version '${f.version}' != registry '${l.version}'`);
          }

          // amendment_history entries must reference existing records
          const records = fs.readdirSync('amendments/records').join('\n');
          for (const [id, info] of lawFiles)
            for (const amd of info.amendments)
              if (!records.includes(amd)) fail(`${id}: amendment_history references ${amd}, no record in amendments/records/`);

          if (failed) process.exit(1);
          console.log(`law-integrity: ${lawFiles.size} laws consistent with registry`);
          EOF

      - name: Law changes require an amendment record (check 4)
        run: |
          node - <<'EOF'
          const { execSync } = require('child_process');
          const fs = require('fs');
          const base = process.env.GITHUB_BASE_REF || 'main';
          execSync(`git fetch origin ${base} --depth=1`, { stdio: 'inherit' });
          const diff = execSync(`git diff --name-only origin/${base}...HEAD`, { encoding: 'utf8' })
            .split('\n').filter(Boolean);

          const changedLawFiles = diff.filter((f) => /^laws\/article-.*\/LAW-.*\.md$/.test(f));
          if (changedLawFiles.length === 0) {
            console.log('law-integrity: no law files changed in this PR');
            process.exit(0);
          }

          // Changed law IDs must each appear in an amendment record present in this PR's tree
          const recordsDir = 'amendments/records';
          const records = fs.readdirSync(recordsDir)
            .map((f) => ({ f, body: fs.readFileSync(`${recordsDir}/${f}`, 'utf8') }));

          let failed = false;
          for (const file of changedLawFiles) {
            const id = (file.match(/LAW-[\d.]+\d/) || [])[0];
            const covering = records.filter((r) => r.body.includes(id));
            // The covering amendment must itself be new or updated in this PR,
            // or at minimum exist and reference the law
            const inDiff = covering.some((r) => diff.includes(`${recordsDir}/${r.f}`));
            if (covering.length === 0) {
              console.error(`::error::${file} changed but NO amendment record references ${id} — [AMENDMENT-PROCESS.md] a change without an amendment record is a constitutional violation`);
              failed = true;
            } else if (!inDiff) {
              console.error(`::error::${file} changed but no amendment record referencing ${id} was added/updated in this PR (found only pre-existing: ${covering.map((r) => r.f).join(', ')})`);
              failed = true;
            } else {
              console.log(`${id}: covered by amendment record(s) ${covering.filter((r) => diff.includes(`${recordsDir}/${r.f}`)).map((r) => r.f).join(', ')}`);
            }
          }
          if (failed) process.exit(1);
          console.log('law-integrity: every changed law is covered by an amendment record in this PR');
          EOF
